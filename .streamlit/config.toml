# Streamlit configuration for Early Signal (local + Streamlit Community Cloud).

[theme]
primaryColor = "#d84315"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f5f0f6"
textColor = "#1a1a1a"
font = "sans serif"

[server]
headless = true
# Streamlit Cloud manages CORS/XSRF and the port; no manual overrides needed.

[browser]
gatherUsageStats = false
